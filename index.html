<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Homepage -->
  <div class="quiz-container" id="start-screen">
    <h1>Quick Quiz</h1>
    <p>Test your knowledge of computers and programming. Answer before the timer runs out!</p>
    <button id="start-btn">Start Quiz</button>
  </div>
  <!-- Quiz (your real one: id + hidden added) -->
  <div class="quiz-container hidden" id="quiz-screen">
    <div class="quiz-header">
      <div id="timer-display">Time: <span id="time-left">10</span>s</div>
      <div id="high-score-display">High Score: <span id="high-score">0</span></div>
    </div>

  <div class="progress-text" id="progress-text">1/15</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <h2 id="question">Question text goes here</h2>
    <div id="answer-buttons" class="btn-grid"></div>
    <button id="next-btn" class="next-btn">Next</button>
  </div>

  <!-- Results (moved out into its own card) -->
  <div class="quiz-container hidden" id="score-container">
    <h3>Your Score: <span id="score">0</span></h3>
    <h4>High Score: <span id="final-high-score">0</span></h4>
    <button onclick="restartQuiz()">Restart Quiz</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
